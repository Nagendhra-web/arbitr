\* Larger model for make release-check.
\* One key and three workers. Keys do not interact
\* except through the shared workers, and a second key makes the state space
\* too large to check in ten minutes (MaxAttempts = 4 alone takes about 11).
CONSTANTS
    Keys = {k1}
    Workers = {w1, w2, w3}
    Hashes = {h1, h2}
    Modes = {"native", "probe", "none"}
    OnUnknownRules = {"require_approval", "retry", "fail"}
    MaxAttempts = 3
    Nil = Nil
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    AtMostOnceEffect
    NoSilentRetry
    NoExecuteWithoutLedger
    ApprovalBinding
    CancelledNeverRuns
PROPERTIES
    LegalTransitions
    TerminalIsFinal
    Settles
