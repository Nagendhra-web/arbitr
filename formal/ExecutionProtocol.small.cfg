\* Small model for make ci (must finish in under 2 minutes).
\* One key and two workers racing on it. Init still tries every mode and policy.
CONSTANTS
    Keys = {k1}
    Workers = {w1, w2}
    Hashes = {h1, h2}
    Modes = {"native", "probe", "none"}
    OnUnknownRules = {"require_approval", "retry", "fail"}
    MaxAttempts = 3
    Nil = Nil
SPECIFICATION LiveSpec
INVARIANTS
    TypeOK
    AtMostOnceEffect
    NoSilentRetry
    NoExecuteWithoutLedger
    ApprovalBinding
    CancelledNeverRuns
PROPERTIES
    LegalTransitions
    TerminalIsFinal
    Settles
