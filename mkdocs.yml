site_name: Arbitr
site_description: Open source action ledger and safety gate for AI agents.
repo_url: https://github.com/nagendhra-web/arbitr
docs_dir: docs
strict: true
theme:
  name: material
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Configuration: configuration.md
  - Policy reference: policy-reference.md
  - Blast radius previews: previews.md
  - Recovery: recovery.md
  - Integrations: integrations/index.md
  - Operations: operations/index.md
  - Threat model: THREAT_MODEL.md
  - Design:
      - Public API: design/api.md
